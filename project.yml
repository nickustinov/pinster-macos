name: itsypin
options:
  deploymentTarget:
    macOS: "13.0"
  bundleIdPrefix: com.itsypin
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

configs:
  Debug: debug
  Debug-AppStore: debug
  Release: release
  Release-AppStore: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    DEVELOPMENT_TEAM: R892A93W42
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"

schemes:
  itsypin:
    build:
      targets:
        itsypin: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
  itsypin-appstore:
    build:
      targets:
        itsypin: all
    run:
      config: Debug-AppStore
    test:
      config: Debug-AppStore
    archive:
      config: Release-AppStore

targets:
  itsypin:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - itsypin.entitlements
          - itsypin-direct.entitlements
      - path: Assets
        buildPhase: resources
        excludes:
          - demo-v3.gif
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/itsypin.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.itsypin.app
        PRODUCT_NAME: Itsypin
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.2.2"
        CURRENT_PROJECT_VERSION: "122"
        ENABLE_HARDENED_RUNTIME: true
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/itsypin-direct.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/itsypin-direct.entitlements
        Debug-AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
        Release-AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
